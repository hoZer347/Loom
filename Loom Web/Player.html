<!DOCTYPE html>
<!--
  The page play-web.ps1 writes for a Play Web build, with its title, base,
  script, scene, files and key bindings filled in where they are named in
  braces. The base is the project folder as the page addresses it, and every
  URL here is relative to it, so the relative shader paths a scene stores
  resolve there.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="{BASE}" />
    <link rel="icon" href="data:," />
    <title>{TITLE}</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      /* The engine hard-codes the "#canvas" selector. */
      #canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        touch-action: none;
      }

      #gpu-notice {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        max-width: min(480px, calc(100% - 32px));
        box-sizing: border-box;
        padding: 14px 16px;
        border-radius: 8px;
        background: #1e293b;
        color: #e2e8f0;
        font: 14px/1.5 system-ui, sans-serif;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      }

      #gpu-notice[hidden] {
        display: none;
      }

      #gpu-notice strong {
        display: block;
        margin-bottom: 6px;
      }

      #gpu-notice p {
        margin: 0 0 8px;
      }

      #gpu-notice ol {
        margin: 0 0 10px;
        padding-left: 20px;
      }

      #gpu-address[hidden] {
        display: none;
      }

      #gpu-address code {
        margin-right: 8px;
        padding: 2px 6px;
        border-radius: 4px;
        background: #0f172a;
        user-select: all;
      }

      #gpu-notice button {
        padding: 4px 12px;
        border: 0;
        border-radius: 4px;
        background: #334155;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" tabindex="0"></canvas>

    <div id="gpu-notice" role="alert" hidden>
      <strong id="gpu-title">Hardware acceleration is off</strong>
      <p id="gpu-why"></p>
      <p id="gpu-address" hidden><code></code><button type="button" id="gpu-copy" title="Copies the settings address">Copy</button></p>
      <ol id="gpu-steps"></ol>
      <button type="button" id="gpu-dismiss">Dismiss</button>
    </div>

    <script>
      // The scene is fetched into the virtual file system before main runs,
      // so main never waits on the network. Waiting there makes it async, and
      // the unwind the main loop starts with escapes as an unhandled rejection.
      // So are the project's fonts and images, at the paths under it a UiText
      // or UiRect names them by, which resolve from the root the program runs
      // in, and its key bindings when it has any.
      var Module = {
        canvas: document.getElementById("canvas"),
        arguments: ["/scene.loomscene"],
        // stb_image decodes the images itself; the browser would only keep a
        // decoded copy of each, and write none it could not decode.
        noImageDecoding: true,
        preRun: [
          () => {
            Module.FS.createPreloadedFile("/", "scene.loomscene", "{SCENE}", true, false);

            if ("{INPUT}")
              Module.FS.createPreloadedFile("/", "project.loominput", "{INPUT}", true, false);

            for (const file of {FILES}) {
              const folder = "/" + file.substring(0, file.lastIndexOf("/") + 1);

              Module.FS.mkdirTree(folder);
              Module.FS.createPreloadedFile(folder, file.substring(file.lastIndexOf("/") + 1), file, true, false);
            }
          },
        ],
        // The engine takes its viewport from resize events, and a canvas that
        // is already the right size never sends one. Queued, so it lands once
        // main has made the window. A page holding the player calls in, as
        // loom_edit_shader, only once initialized is set.
        onRuntimeInitialized: () => {
          Module.initialized = true;
          setTimeout(() => window.dispatchEvent(new Event("resize")));
        },
      };

      // GLFW sizes the canvas to the window it was asked for once the engine
      // starts, so the backing store is matched to the CSS size every frame
      // rather than once. The resize event is what moves the engine's viewport.
      (function watchCanvasSize() {
        const canvas = Module.canvas;

        const tick = () => {
          const ratio = window.devicePixelRatio || 1;
          const width = Math.max(1, Math.round(canvas.clientWidth * ratio));
          const height = Math.max(1, Math.round(canvas.clientHeight * ratio));

          if (canvas.width !== width || canvas.height !== height) {
            canvas.width = width;
            canvas.height = height;
            window.dispatchEvent(new Event("resize"));
          }

          requestAnimationFrame(tick);
        };

        requestAnimationFrame(tick);
      })();

      // The audio worklet's script is asked for by its bare name, which the
      // base above would look for at the project root rather than beside the
      // player script.
      (function locateAudioWorklet() {
        const addModule = AudioWorklet.prototype.addModule;
        const folder = new URL("{SCRIPT}", document.baseURI);

        AudioWorklet.prototype.addModule = function (url, options) {
          return addModule.call(this, new URL(url, folder).href, options);
        };
      })();

      // A ComputeShader calls in as it first runs, drawable false when the GPU
      // cannot draw into float textures. A context that fails with
      // failIfMajorPerformanceCaveat is one the browser draws in software.
      Module.loomCheckGpu = (drawable) => {
        const probe = document.createElement("canvas").getContext("webgl2", { failIfMajorPerformanceCaveat: true });

        if (drawable && probe)
          return;

        const show = (title, why, address, steps) => {
          document.getElementById("gpu-title").textContent = title;
          document.getElementById("gpu-why").textContent = why;
          document.getElementById("gpu-address").hidden = !address;
          document.querySelector("#gpu-address code").textContent = address;
          document.getElementById("gpu-steps").replaceChildren(
            ...steps.map((step) => Object.assign(document.createElement("li"), { textContent: step })));
          document.getElementById("gpu-notice").hidden = false;
        };

        if (probe) {
          show("This GPU cannot run compute shaders", "Its WebGL cannot draw into float textures, which hold this page's simulation, so the simulation is not running.", "", []);
          return;
        }

        // Pages cannot open a browser's own settings, so the address is copied
        // for the address bar instead.
        const why = "This page simulates on the graphics card, and the browser has switched it off, so the simulation is not running.";
        const agent = navigator.userAgent;

        if (agent.includes("Firefox"))
          show("Hardware acceleration is off", why, "about:preferences#general", ["Paste it into the address bar", "Under Performance, untick Use recommended performance settings", "Tick Use hardware acceleration when available", "Restart Firefox"]);
        else if (agent.includes("Edg/"))
          show("Hardware acceleration is off", why, "edge://settings/system", ["Paste it into the address bar", "Turn on Use graphics acceleration when available", "Restart Edge"]);
        else if (agent.includes("Chrome"))
          show("Hardware acceleration is off", why, "chrome://settings/system", ["Paste it into the address bar", "Turn on Use graphics acceleration when available", "Relaunch Chrome"]);
        else
          show("Hardware acceleration is off", why, "", ["Turn on hardware or graphics acceleration in the browser's settings", "Restart the browser"]);
      };

      document.getElementById("gpu-copy").addEventListener("click", async () => {
        const button = document.getElementById("gpu-copy");

        try {
          await navigator.clipboard.writeText(document.querySelector("#gpu-address code").textContent);
          button.textContent = "Copied";
        } catch {
          button.textContent = "Select and copy it";
        }
      });

      document.getElementById("gpu-dismiss").addEventListener("click", () => {
        document.getElementById("gpu-notice").hidden = true;
        Module.canvas.focus();
      });

      Module.canvas.addEventListener("click", () => Module.canvas.focus());
      Module.canvas.addEventListener("contextmenu", (e) => e.preventDefault());
    </script>
    <script async src="{SCRIPT}"></script>
  </body>
</html>
