<!DOCTYPE html>
<!--
  The page the browser suite runs in. run.mjs serves it with the cross-origin
  isolation headers a pthreads build needs and reads loomExit to finish.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <title>Loom Browser Tests</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }

      /* The engine hard-codes the "#canvas" selector. */
      #canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" tabindex="0"></canvas>

    <script>
      var Module = {
        canvas: document.getElementById("canvas"),
        // Set by a case that wants input, cleared by run.mjs once it is sent.
        loomRequest: null,
        // Every keydown the page has had, repeats among them, so a case can
        // tell one has landed when it should change nothing.
        loomKeydowns: 0,
        onExit: (code) => (window.loomExit = code),
        onAbort: () => (window.loomExit = "abort"),
      };

      addEventListener("keydown", () => Module.loomKeydowns++, true);
    </script>
    <script async src="tests.js"></script>
  </body>
</html>
